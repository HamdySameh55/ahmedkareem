<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Abdou — Motivation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="lang-ar" dir="rtl">

<div class="container">
  <header class="app-header" id="appHeader"></header>

  <div class="quote-card">
    <div class="eyebrow"><span class="i18n-ar">جملة اليوم</span><span class="i18n-en">Today's Line</span></div>
    <p id="quoteOfDay"></p>
  </div>

  <div class="mot-toggle" id="motToggle">
    <button data-mode="serious" class="active"><span class="i18n-ar">تحفيز</span><span class="i18n-en">Motivation</span></button>
    <button data-mode="fun"><span class="i18n-ar">هزار</span><span class="i18n-en">Banter</span></button>
  </div>

  <div class="mot-list" id="motList"></div>

  <footer class="page-footer">
    <span class="i18n-ar">خطة أحمد عبدو — ضخامة ٣٠ يوم.</span>
    <span class="i18n-en">Ahmed Abdou's Plan — 30-day bulk.</span>
  </footer>
</div>

<nav class="bottom-nav" id="appNav"></nav>

<script src="app.js"></script>
<script>
renderHeader('motivation', {
  eyebrow: '<span class="i18n-ar">التحفيز</span><span class="i18n-en">Motivation</span>',
  title: '<span class="i18n-ar">كلام يخليك مكمل</span><span class="i18n-en">Words to Keep You Going</span>',
  desc: '<span class="i18n-ar">٣٠ يوم ضخامة. حلقة جادة عشان تحافظ على الشغف، وحلقة هزار عشان تفضل مبتسم.</span><span class="i18n-en">30 days of bulking. A serious ring to keep the drive, and a lighter ring for humor.</span>'
});
renderNav('motivation');

let motMode = 'serious';
function renderMot(){
  const list = document.getElementById('motList');
  list.innerHTML = MOTIVATION[motMode].map(m=>`
    <div class="mot-item"><span class="i18n-ar">${m.ar}</span><span class="i18n-en">${m.en}</span></div>
  `).join('');
}
document.getElementById('motToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  motMode = btn.dataset.mode;
  document.querySelectorAll('#motToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  renderMot();
});
renderMot();

(function(){
  const all = MOTIVATION.serious;
  const today = new Date();
  const seed = today.getFullYear()*372 + today.getMonth()*31 + today.getDate();
  const q = all[seed % all.length];
  document.getElementById('quoteOfDay').innerHTML =
    `<span class="i18n-ar">${q.ar}</span><span class="i18n-en">${q.en}</span>`;
})();
</script>
</body>
</html>
